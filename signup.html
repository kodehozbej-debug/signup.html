<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join the Program</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #F6F3EC;
    --surface: #FFFFFF;
    --surface-border: #E4DECF;
    --text: #201D17;
    --muted: #766F5F;
    --accent: #3C6B54;
    --accent-hover: #2F5744;
    --accent-contrast: #FBF8F0;
    --error: #A6412C;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #16150F;
      --surface: #1F1D16;
      --surface-border: #35311F;
      --text: #F2EEE2;
      --muted: #A79E88;
      --accent: #6FAE8B;
      --accent-hover: #86C1A2;
      --accent-contrast: #101410;
      --error: #E08469;
    }
  }

  :root[data-theme="dark"]{
    --bg: #16150F;
    --surface: #1F1D16;
    --surface-border: #35311F;
    --text: #F2EEE2;
    --muted: #A79E88;
    --accent: #6FAE8B;
    --accent-hover: #86C1A2;
    --accent-contrast: #101410;
    --error: #E08469;
  }

  *{ box-sizing: border-box; }

  html, body{ margin: 0; padding: 0; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  .card{
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 18px;
    padding: 40px 36px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .eyebrow{
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1{
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: clamp(28px, 5vw, 34px);
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
  }

  p.lede{
    margin: 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 42ch;
  }

  form{
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 6px;
  }

  .field{
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label{
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }

  input{
    font: inherit;
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--surface-border);
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input::placeholder{ color: var(--muted); opacity: 0.7; }

  input:focus-visible{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }

  .error-text{
    font-size: 12.5px;
    color: var(--error);
    min-height: 1em;
  }

  button{
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent-contrast);
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 13px 18px;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  button:hover{ background: var(--accent-hover); }
  button:active{ transform: translateY(1px); }
  button:disabled{ opacity: 0.6; cursor: default; }

  button:focus-visible, input:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .success{
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: left;
  }

  .success .mark{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-contrast);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin-bottom: 4px;
  }

  [hidden]{ display: none !important; }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }

  @media (max-width: 420px){
    .card{ padding: 32px 24px; border-radius: 14px; }
  }
</style>
</head>
<body>

<div class="card">
  <div id="formView">
    <div class="eyebrow">You're invited</div>
    <h1>Join the program</h1>
    <p class="lede">Leave your name and email and we'll send you a welcome note with everything you need to get started.</p>
    <form id="signupForm" novalidate>
      <div class="field">
        <label for="nameInput">Name</label>
        <input id="nameInput" name="name" type="text" placeholder="Jane Novak" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="emailInput">Email</label>
        <input id="emailInput" name="email" type="email" placeholder="jane@example.com" autocomplete="email" required>
        <div class="error-text" id="errorText"></div>
      </div>
      <button type="submit" id="submitBtn">Join the program</button>
    </form>
  </div>

  <div id="successView" class="success" hidden>
    <div class="mark">&#10003;</div>
    <h1>You're in</h1>
    <p class="lede">Thanks for joining &mdash; check your inbox in a few minutes for a welcome email.</p>
  </div>
</div>

<script>
  // Your Make.com webhook URL — receives each submission and adds it to your sheet.
  var WEBHOOK_URL = "https://hook.eu1.make.com/jyimwuykdag2wvawg2h9fz1cepio2rfg";

  var form = document.getElementById('signupForm');
  var errorText = document.getElementById('errorText');
  var submitBtn = document.getElementById('submitBtn');
  var formView = document.getElementById('formView');
  var successView = document.getElementById('successView');

  function isValidEmail(value){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    errorText.textContent = '';

    var name = document.getElementById('nameInput').value.trim();
    var email = document.getElementById('emailInput').value.trim();

    if(!name){
      errorText.textContent = 'Please enter your name.';
      return;
    }
    if(!isValidEmail(email)){
      errorText.textContent = 'Please enter a valid email address.';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Joining…';

    var body = new URLSearchParams();
    body.set('name', name);
    body.set('email', email);

    // mode: 'no-cors' so this works regardless of the webhook's CORS
    // headers — we don't need to read the response, just fire it.
    fetch(WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: body
    }).then(function(){
      formView.hidden = true;
      successView.hidden = false;
    }).catch(function(){
      submitBtn.disabled = false;
      submitBtn.textContent = 'Join the program';
      errorText.textContent = "Something went wrong — please check your connection and try again.";
    });
  });
</script>
</body>
</html>
